<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 432" width="1080" height="432" role="img" aria-labelledby="architecture-title architecture-desc">
<title id="architecture-title">How SceShellNative fits together</title>
<desc id="architecture-desc">The PS5 shell and its React Native apps come unmodified from a firmware dump and run on Mono and JavaScriptCore; SceShellNative is the host boundary underneath them, the PS5 platform reimplemented on Windows over Vulkan.</desc>
<defs><linearGradient id="architecture-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d1e27"/><stop offset="1" stop-color="#22232c"/></linearGradient><pattern id="architecture-g" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#cba56e" stroke-opacity=".05" stroke-width="1"/></pattern><pattern id="architecture-G" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#cba56e" stroke-opacity=".10" stroke-width="1"/></pattern></defs>
<style>.name{font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#e4e0d6} .sub{font:500 10px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#9d988d;letter-spacing:.08em} .eyebrow{font:500 10px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#9d988d;letter-spacing:.14em} .chip{font:500 10px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#cba56e} .gold{fill:#cba56e}</style>
